# Pre-commit configuration for pydantic-ai-sandbox.
# Plan §4.3 / Spec Req 1.5, 7.6, 8.1, 8.2, 8.3.
#
# Default stage (runs on every `git commit`):
#   * ruff check                — lint, security (S = flake8-bandit), complexity, docstrings, naming
#   * ruff format --check       — formatting consistency
#   * pyright                   — strict type-check against Python 3.13
#   * gitleaks                  — secret scanning (Req 9.3)
#   * forbid-hardcoded-model-ids — local pygrep guard (Req 1.5, Plan AD-4)
#
# Pre-push stage (runs on every `git push`):
#   * ollama-integration — live-Ollama integration lane (skips when no daemon)
#
# Manual stage (`mise run pre-commit:manual`, on demand):
#   * pytest      — full unit + integration suite
#   * pip-audit   — dependency CVE scan
#
# `bandit` is intentionally absent: ruff's `S` rule set (enabled in pyproject.toml)
# is a Py3-complete superset of flake8-bandit for this project's surface area
# (see Spec Q3 amendment / research.md "bandit 非導入の根拠").
#
# NOTE: `default_install_hook_types` gained `pre-push`, so an existing clone
# must re-run `mise run setup` (i.e. `pre-commit install`) once to get the new
# hook wired into .git/hooks/pre-push.

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # --------------------------------------------------------------------------
  # Default stage: lint / format / type-check / model-ID guard.
  # Hooks below use `language: system` so they invoke the project's pinned
  # dev-deps (uv-managed) rather than re-downloading separate copies. This
  # keeps `mise run check` and `pre-commit run` byte-identical.
  # --------------------------------------------------------------------------
  - repo: local
    hooks:
      # `exclude: ^patterns/` on the three tool hooks below: patterns/ lanes
      # are independent uv projects (Spec 005 AD-1) whose deps are absent
      # from the root venv, so root-venv ruff/pyright would fail on them.
      # Lane quality gates are enforced by `mise run patterns:check` and the
      # patterns-ci.yml matrix instead of at commit time (documented
      # trade-off, Spec 005 plan §7). gitleaks and the model-ID guard keep
      # covering patterns/ — secrets and hardcoded model IDs are repo-wide
      # invariants.
      - id: ruff-check
        name: ruff check (lint; S/C90/D/N/T20)
        language: system
        entry: uv run ruff check
        types: [python]
        exclude: ^patterns/

      - id: ruff-format-check
        name: ruff format --check
        language: system
        entry: uv run ruff format --check
        types: [python]
        exclude: ^patterns/

      - id: pyright
        name: pyright (strict, py3.13)
        language: system
        entry: uv run pyright
        types: [python]
        pass_filenames: false
        require_serial: true
        exclude: ^patterns/

      # Mirror of tests/unit/test_no_hardcoded_model_ids.py::FORBIDDEN_MODEL_ID_LITERALS.
      # Both guards intentionally share the same vocabulary; update them in
      # lockstep whenever a new banned literal must be added. The runtime test
      # is the source of truth — the regex below is a re-serialisation.
      - id: forbid-hardcoded-model-ids
        name: forbid-hardcoded-model-ids (Req 1.5)
        language: pygrep
        entry: '(granite4\.1:8b|claude-sonnet-4-6|claude-haiku-4-5-20251001-v1:0|llama3\.2-vision:11b|granite-4-h-small)'
        types: [python]
        # tests/** is exempt because the runtime test must reference these
        # literals as data. src/**/config.py is reserved as a future home for
        # documented env-default values that should never embed real model IDs.
        exclude: '^(tests/.*|src/.*/config\.py)$'

  # --------------------------------------------------------------------------
  # Default stage: secret scanning (Req 9.3).
  # gitleaks is a Go binary, so we use the upstream repo with a pinned rev
  # rather than `language: system` — keeps the developer machine free of an
  # extra system-level install.
  # --------------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # --------------------------------------------------------------------------
  # Pre-push stage: the live-Ollama integration lane.
  #
  # This is where live 8B inference is exercised now that GitHub's
  # `integration-ollama.yml` is workflow_dispatch-only (Actions usage-limit
  # control). Pre-push rather than pre-commit because the lane costs minutes,
  # not seconds — paying it once per push instead of once per commit keeps the
  # inner loop fast while still gating anything that reaches the remote.
  #
  # The hook delegates to scripts/pre-push-ollama.sh, which warn-and-skips when
  # no daemon is listening (see that file's header for the escape hatches).
  # `always_run: true` + `pass_filenames: false`: the router's behaviour can
  # change through config or dependency edits, so the lane must not be keyed to
  # a file-type filter.
  # --------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: ollama-integration
        name: live-Ollama integration lane (pre-push)
        language: system
        entry: bash scripts/pre-push-ollama.sh
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # --------------------------------------------------------------------------
  # Manual stage: heavy gates excluded from the default commit path (Req 8.3,
  # NFR-7). Run on demand via `mise run pre-commit:manual`; CI no longer runs
  # this stage (it would be a third pytest + a second pip-audit per run — see
  # `mise run pre-commit:validate`, which is what ci.yml calls instead).
  # --------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: pytest
        name: pytest (manual stage)
        language: system
        entry: uv run pytest
        pass_filenames: false
        stages: [manual]

      - id: pip-audit
        name: pip-audit (manual stage)
        language: system
        entry: uv run pip-audit
        pass_filenames: false
        stages: [manual]
