# Constitution Principle V single-entry quality gate, mirrored to CI.
# Spec Req 6.5, 7.1-7.4, 7.7, 8.4, 10.4 / Plan §4.3 / tasks.md T12.1.
#
# Local and CI run the same mise tasks (lint + format + typecheck + test).
# Tool versions live in pyproject.toml's dev-deps; mise.toml owns the
# entry-point names. This workflow MUST NOT introduce its own pinned tool
# versions — every command is a one-line shell pass-through to mise.
#
# ---------------------------------------------------------------------------
# CI optimization (Actions usage-limit control) — two changes here:
#
# 1. ONE pytest run, not three. This workflow used to run the suite via
#    `mise run check`, again via `mise run pre-commit:manual`, and a third time
#    to produce coverage.xml. It now runs `check:static` (lint / format /
#    typecheck) plus a single `cov:xml` (pytest + coverage + XML). The manual
#    stage is replaced by `pre-commit:validate`, which preserves Req 8.4's
#    actual intent — catching a drifted / unparseable hook config — in ~1s;
#    its pip-audit half is already covered by security.yml on the same PR.
#
# 2. NO push trigger. Every change reaches main through a pull request, and the
#    PR run gates it, so re-running the identical commit on the merge push was
#    a duplicate. `workflow_dispatch` remains for the occasional manual re-run
#    of main. Consequence: the `coverage-baseline` artifact upload is gone
#    (nothing runs on main to produce it); the PR comment still reports the
#    PR's own coverage, and pyproject's `fail_under` ratchet is what actually
#    enforces the floor.
# ---------------------------------------------------------------------------

name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cancel superseded runs on the same PR ref to keep the queue lean; a manual
# dispatch is deliberate, so it is never cancelled by a sibling.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write  # python-coverage-comment-action posts PR comments

jobs:
  check:
    name: mise run check:static + cov:xml
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # full history is required for diff-coverage on PRs

      # mise installs the Python 3.13 / uv versions declared in mise.toml.
      # `experimental: true` is required while mise's GitHub Action calls
      # un-stable subcommands; remove once the action stabilises.
      - name: Install mise + tooling
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          # Pin action SHA + mise binary version: stop fetching a moving "latest"
          # mise asset (the transient 404 of root cause #1 / plan P5).
          version: 2026.6.10
          experimental: true
          install: true
          cache: true

      - name: Sync project dependencies
        run: uv sync --all-groups

      # ----------------------------------------------------------------------
      # Constitution Principle V — the aggregate gate, minus the test half.
      # `mise run check:static` depends-runs lint / format / typecheck. If any
      # gate fails the rest still run via mise's depends model so reviewers see
      # the full failure surface, not just the first error. The test half is
      # the `cov:xml` step below — running it there instead of here is what
      # collapsed three pytest runs into one.
      # ----------------------------------------------------------------------
      - name: mise run check:static (lint / format / typecheck)
        run: mise run "check:static"

      # ----------------------------------------------------------------------
      # Spec Req 7.5 / 7.7 / 10.4 — the test gate AND the coverage XML in one
      # pytest invocation. `--cov-report=xml` writes ./coverage.xml; pytest
      # reads coverage source / branch settings and the `fail_under` ratchet
      # from pyproject.toml, so a coverage regression reds this step.
      # ----------------------------------------------------------------------
      - name: mise run cov:xml (pytest + coverage + XML)
        run: mise run "cov:xml"

      # ----------------------------------------------------------------------
      # Spec Req 8.4 — a drifted or unparseable .pre-commit-config.yaml must be
      # caught before merge. Validating the config is the part of the old
      # `pre-commit:manual` step that CI uniquely provides; its pytest half now
      # runs once above, and its pip-audit half runs in security.yml on the
      # same pull request.
      # ----------------------------------------------------------------------
      - name: mise run pre-commit:validate
        run: mise run "pre-commit:validate"

      - name: Post PR diff coverage comment
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@50d15ff8768f6d897b04e5a0805bd1a98f7096c4 # v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 60
