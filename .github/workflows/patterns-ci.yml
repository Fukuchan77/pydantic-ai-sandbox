# Spec 005 Req 8.1 / plan §6.
#
# Quality gates for the patterns/ framework lanes. Each lane is an
# independent uv project (plan AD-1) with its own lockfile, interpreter
# (.python-version) and tool config, so this workflow runs the per-lane uv
# commands directly in a `fail-fast: false` matrix rather than the looping
# `mise run patterns:check` task — a deliberate divergence from the
# "everything through mise" rule (Constitution V): the loop stops at the
# first failing lane, which would mask the other lanes' status on PRs.
# Local development still uses `mise run patterns:check`.
#
# The root app's ci.yml is intentionally untouched (Req 8.3); root gates
# exclude patterns/ (root pyproject extend-exclude) and this workflow only
# triggers on the patterns surface.
#
# CI optimization (Actions usage-limit control): the `push: branches: [main]`
# trigger is retired. Everything reaches main through a pull request and the PR
# run — same commit, same eight jobs — already gated it, so the merge-push run
# was a duplicate. `workflow_dispatch` covers the occasional manual re-run.

name: patterns-ci

on:
  pull_request:
    branches: [main]
    paths:
      - 'patterns/**'
      # `patterns/**` already matches the shared package, but contracts is a
      # first-class CI surface (the single source of truth the lanes import),
      # so it is listed explicitly per Req 12.1.
      - 'patterns/contracts/**'
      # The RAG application lane (Spec 007-2b Req 11.1) is an independent lane
      # at patterns/rag/ with its own dedicated job below. `patterns/**` already
      # matches it, but it is listed explicitly as a first-class CI surface.
      - 'patterns/rag/**'
      # The SSE delivery lane (Spec 008-2c Req 10.1) is an independent lane at
      # patterns/sse/ with its own dedicated job below. `patterns/**` already
      # matches it, but it is listed explicitly as a first-class CI surface.
      - 'patterns/sse/**'
      # The Deep Research lane (Spec 009 Req 12.1) is an independent lane at
      # patterns/deep-research/ with its own dedicated job below. `patterns/**`
      # already matches it, but it is listed explicitly as a first-class CI surface.
      - 'patterns/deep-research/**'
      # The HITL harness lane (Spec 012 Req 1.6) is an independent lane at
      # patterns/hitl/ with its own dedicated job below. `patterns/**` already
      # matches it, but it is listed explicitly as a first-class CI surface.
      - 'patterns/hitl/**'
      - 'mise.toml'
      - '.github/workflows/patterns-ci.yml'
  workflow_dispatch: {}

concurrency:
  group: patterns-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lane:
    name: ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lane: [pydantic-ai, beeai, llamaindex]
        include:
          # GHSA-xf7x-x43h-rpqh (json-repair, declared range < 0.60.1,
          # circular-$ref infinite loop): this lane is NOT AFFECTED — the
          # vulnerable module schema_repair.py first shipped in 0.56.0, and the
          # lane locks 0.39.1 (no `schema` symbol anywhere in the package; its
          # loads() takes no schema argument). The advisory range is over-broad;
          # the real window is 0.56.0-0.60.0 (0.60.0 still ships the unfixed
          # loop; cycle detection lands in 0.60.1). Suppression is kept only
          # because pip-audit matches the declared range, not reachability.
          # Permanently safe: beeai-framework caps json-repair<0.40.0 at the
          # ==0.1.39 pin and <0.53.0 even at latest 0.1.82 — every reachable
          # version sits below 0.56.0. Per the SECURITY-NOTES.md runbook
          # (Spec 013 R8.1/8.2). Re-evaluate only if the locked json-repair
          # enters 0.56.0-0.60.0. Review by 2026-10-14. Tracking: #30.
          - lane: beeai
            audit_args: --ignore-vuln GHSA-xf7x-x43h-rpqh
          # PYSEC-2026-3740 (GHSA-8mgp-746c-j5xp / CVE-2026-81726, nltk 3.10.3,
          # a llama-index-core transitive): NLTK's model-artifact import/export
          # helpers call built-in open() on caller-controlled paths instead of
          # the pathsec-aware helpers, escaping the allowed roots when path
          # security is enforced. NOT reachable in this lane — the advisory
          # needs pathsec.ENFORCE enabled *and* untrusted control of a model
          # import/export path, and none of the affected components
          # (TransitionParser / AveragedPerceptron /
          # PerceptronTagger.save_to_json / save_maxent_params) is called; the
          # lane src imports no nltk symbol at all. No fix release exists
          # (fixed_in empty; 3.10.3 is the latest nltk on PyPI), so unlike the
          # 2026-07 PYSEC-2026-597 precedent there is no version to bump into.
          # Suppression kept only because pip-audit matches the declared range,
          # not reachability. Per the SECURITY-NOTES.md runbook (Spec 013
          # R8.1/8.2). Review by 2026-11-05; tracked by the dated entry in
          # patterns/SECURITY-NOTES.md. Retire as soon as nltk ships a fix.
          - lane: llamaindex
            audit_args: --ignore-vuln PYSEC-2026-3740
    defaults:
      run:
        working-directory: patterns/frameworks/${{ matrix.lane }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # uv reads each lane's .python-version and provisions the matching
      # interpreter (3.14 for pydantic-ai, 3.13 for beeai/llamaindex) —
      # no mise needed in this workflow (plan AD-5).
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: patterns/frameworks/${{ matrix.lane }}/uv.lock

      # P4 lock hygiene: fail fast on lockfile drift (lock out of sync with
      # pyproject) before the heavier sync/test; `uv sync --locked` below is the
      # install-time backstop. This is what would block a recurrence of root
      # cause #3 (an out-of-constraint dep like httpx 1.0.dev3 in the lock).
      #
      # A pre-release *allowlist/ban* is deliberately NOT enforced: this stack
      # pins many intentional, working pre-releases (pydantic 2.14 alpha,
      # opentelemetry 0.63b, litellm rc, numpy/sqlalchemy rc/b, pydantic-ai v2
      # beta), governed per lane by `[tool.uv] prerelease`. A content guard would
      # red CI on legitimate pre-releases. See specs/ci-strategy-review (P4).
      - name: uv lock --check (no drift)
        run: uv lock --check

      - name: Sync lane dependencies (locked)
        run: uv sync --all-groups --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: pyright (strict)
        run: uv run pyright

      - name: pytest (offline, coverage floor 98)
        run: uv run pytest --cov --cov-report=term

      # Spec 005 Req 7.2: per-lockfile dependency CVE scan. `audit_args` is
      # empty for every lane except the runbook-suppressed beeai entry above.
      - name: pip-audit
        run: uv run pip-audit ${{ matrix.audit_args }}

  # The shared patterns/contracts package (Spec 006-2a Req 1.1) is the single
  # source of truth the lanes import via `tool.uv.sources`. It is its own uv
  # project on Python 3.13 (the lane floor, NFR-5), so it gets a dedicated job
  # mirroring the lane gates rather than a matrix entry. The pytest step runs
  # tests/unit/test_contract_drift.py — the single-point drift guard asserting
  # README 正本 == package (Req 2.1/2.2). Req 12.1.
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: patterns/contracts
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # uv reads patterns/contracts/.python-version (3.13) and provisions the
      # matching interpreter — no mise needed (plan AD-5).
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: patterns/contracts/uv.lock

      # P4 lock-drift gate (rationale on the lane job above).
      - name: uv lock --check (no drift)
        run: uv lock --check

      - name: Sync contracts dependencies (locked)
        run: uv sync --all-groups --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: pyright (strict)
        run: uv run pyright

      # Includes the single-point contract drift guard (README 正本 == package).
      - name: pytest (offline + drift, coverage floor 85)
        run: uv run pytest --cov --cov-report=term

      # Spec 005 Req 10.2: dependency CVE scan for the shared package too.
      - name: pip-audit
        run: uv run pip-audit

  # The RAG application lane (Spec 007-2b Req 1.1) is an independent uv project
  # at patterns/rag/ — depth 1 under patterns/, a sibling of frameworks/, NOT
  # an entry in the lane matrix above (ADR-1 / Task 0 spike: 119 pkg, no torch /
  # onnxruntime). Like contracts it gets a dedicated job mirroring the lane gates
  # (Req 11.1). The unit suite is offline and hermetic: HF_HUB_OFFLINE=1 is forced
  # in patterns/rag/pyproject.toml and HybridChunker runs against a deterministic
  # word tokenizer, so NO Hugging Face model pre-fetch step is needed (R6.1 /
  # Req 11.3). Coverage floor is the sibling-lane parity 98 (NFR-4).
  rag:
    name: rag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: patterns/rag
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # uv reads patterns/rag/.python-version (3.13, capped to dodge 3.14 wheel
      # gaps in the Docling/LlamaIndex trees) and provisions the matching
      # interpreter — no mise needed (plan AD-5).
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: patterns/rag/uv.lock

      # P4 lock-drift gate (rationale on the lane job above).
      - name: uv lock --check (no drift)
        run: uv lock --check

      - name: Sync rag dependencies (locked)
        run: uv sync --all-groups --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: pyright (strict)
        run: uv run pyright

      # Offline + hermetic: HF_HUB_OFFLINE=1 (pyproject env) keeps the real
      # HybridChunker tokenizer off the Hub; no model pre-fetch needed (Req 11.3).
      - name: pytest (offline, coverage floor 98)
        run: uv run pytest --cov --cov-report=term

      # Spec 005 Req 7.2 / 007-2b Req 11.1: per-lockfile dependency CVE scan.
      # PYSEC-2026-3740 (GHSA-8mgp-746c-j5xp / CVE-2026-81726, nltk 3.10.3,
      # pulled in by llama-index-core): NLTK's model-artifact import/export
      # helpers use built-in open() on caller-controlled paths instead of
      # the pathsec-aware helpers. NOT reachable in this lane -- the
      # advisory needs pathsec.ENFORCE on plus untrusted control of a model
      # path, and none of the affected components (TransitionParser /
      # AveragedPerceptron / PerceptronTagger.save_to_json /
      # save_maxent_params) is called; this lane's src imports no nltk
      # symbol. No fix release exists (fixed_in empty; 3.10.3 is the latest
      # nltk), so there is nothing to bump into. Suppressed lane-locally
      # only because pip-audit matches declared ranges, not reachability.
      # Mirrors mise.toml / security.yml's rag entry (both already carried
      # this flag; this job's step was the one spot it was missed). Per the
      # SECURITY-NOTES.md runbook (Spec 013 R8.1/8.2). Review by 2026-11-05;
      # tracked by the dated entry in patterns/SECURITY-NOTES.md.
      - name: pip-audit
        run: uv run pip-audit --ignore-vuln PYSEC-2026-3740

  # The SSE delivery lane (Spec 008-2c Req 1.1) is an independent uv project at
  # patterns/sse/ — depth 1 under patterns/, a sibling of frameworks/ and rag/,
  # NOT an entry in the lane matrix above (Task 0 spike: 11-pkg runtime closure,
  # no ML wheels). Like contracts and rag it gets a dedicated job mirroring the
  # lane gates (Req 10.1). The unit suite is offline and hermetic — a block_network
  # fixture loud-fails on any internet socket and the ASGITransport driver opens
  # no real sockets (R5.1), so NO daemon or model pre-fetch step is needed; the
  # live-Ollama e2e is gated by RUN_INTEGRATION_PATTERNS and runs in the separate
  # patterns-integration-ollama.yml. Coverage floor is the sibling-lane parity 98
  # (NFR-4); the lane lands at 99.01%.
  sse:
    name: sse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: patterns/sse
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # uv reads patterns/sse/.python-version (3.14) and provisions the matching
      # interpreter — no mise needed (plan AD-5).
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: patterns/sse/uv.lock

      # P4 lock-drift gate (rationale on the lane job above).
      - name: uv lock --check (no drift)
        run: uv lock --check

      - name: Sync sse dependencies (locked)
        run: uv sync --all-groups --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: pyright (strict)
        run: uv run pyright

      # Offline + hermetic: block_network fixture + in-process ASGITransport driver
      # keep the whole unit suite network-zero (R5.1); no daemon needed here.
      - name: pytest (offline, coverage floor 98)
        run: uv run pytest --cov --cov-report=term

      # Spec 005 Req 7.2 / 008-2c Req 8.2: per-lockfile dependency CVE scan.
      - name: pip-audit
        run: uv run pip-audit

  # The Deep Research lane (Spec 009 Req 1.1) is an independent uv project at
  # patterns/deep-research/ — depth 1 under patterns/, a sibling of frameworks/ /
  # rag/ / sse/, NOT an entry in the lane matrix above. Like the other app lanes it
  # gets a dedicated job mirroring the lane gates (Req 12.1). The unit suite is
  # offline and hermetic — an autouse block_network fixture loud-fails on any
  # internet socket and the model/search are scripted fakes (Req 8.1), so NO daemon
  # or model pre-fetch step is needed; the live-Ollama e2e is gated by
  # RUN_INTEGRATION_PATTERNS and runs in patterns-integration-ollama.yml. Coverage
  # floor is the sibling-lane parity 98 (NFR-4); the lane lands at 100%.
  deep-research:
    name: deep-research
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: patterns/deep-research
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # uv reads patterns/deep-research/.python-version (3.13, matching the rag app
      # lane; pydantic-ai-slim supports it) and provisions the matching interpreter.
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: patterns/deep-research/uv.lock

      # P4 lock-drift gate (rationale on the lane job above).
      - name: uv lock --check (no drift)
        run: uv lock --check

      - name: Sync deep-research dependencies (locked)
        run: uv sync --all-groups --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: pyright (strict)
        run: uv run pyright

      # Offline + hermetic: autouse block_network fixture + scripted model/search
      # fakes keep the whole unit suite network-zero (Req 8.1); no daemon needed.
      - name: pytest (offline, coverage floor 98)
        run: uv run pytest --cov --cov-report=term

      # Spec 005 Req 7.2 / 009 Req 13: per-lockfile dependency CVE scan.
      - name: pip-audit
        run: uv run pip-audit

  # The HITL harness lane (Spec 012 Req 1.1) is an independent uv project at
  # patterns/hitl/ — depth 1 under patterns/, a sibling of frameworks/ / rag/ /
  # sse/ / deep-research/, NOT an entry in the lane matrix above. Like the sse
  # lane it gets a dedicated job mirroring the lane gates (Req 1.6) on Python
  # 3.14 (the pydantic-ai v2 baseline the deferred-tools mechanism requires).
  # The unit suite is offline and hermetic — conftest.py forces
  # `models.ALLOW_MODEL_REQUESTS = False` unless RUN_INTEGRATION_PATTERNS=1
  # (Req 10.1), so NO daemon or model pre-fetch step is needed; the live-Ollama
  # e2e is gated by RUN_INTEGRATION_PATTERNS and runs in
  # patterns-integration-ollama.yml. Coverage floor is the sibling-lane parity
  # 98 (NFR-4); the lane lands at 100%.
  hitl:
    name: hitl
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: patterns/hitl
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # uv reads patterns/hitl/.python-version (3.14) and provisions the
      # matching interpreter — no mise needed (plan AD-5).
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: patterns/hitl/uv.lock

      # P4 lock-drift gate (rationale on the lane job above).
      - name: uv lock --check (no drift)
        run: uv lock --check

      - name: Sync hitl dependencies (locked)
        run: uv sync --all-groups --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: pyright (strict)
        run: uv run pyright

      # Offline + hermetic: ALLOW_MODEL_REQUESTS=False (conftest) keeps the
      # whole unit suite network-zero (Req 10.1); no daemon needed here.
      - name: pytest (offline, coverage floor 98)
        run: uv run pytest --cov --cov-report=term

      # Spec 012 Req 1.6: per-lockfile dependency CVE scan.
      - name: pip-audit
        run: uv run pip-audit
