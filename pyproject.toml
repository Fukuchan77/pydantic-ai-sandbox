[project]
name = "pydantic-ai-sandbox"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    # ADR-1 (spec 002-watsonx-provider, re-measured for spec 014 2026-10):
    # 1.5.12 could not import foundation_models.ModelInference on Python 3.14
    # (StrEnum/utils.py:1191 TypeError). The root project moved to Python 3.13
    # at the time, then back to Python 3.14 once the floor below imported
    # cleanly there (tests/unit/test_python_baseline.py pins the import as an
    # executable contract). The floor is raised on each refresh to match the
    # version uv.lock resolves and the suite is verified against (1.6.0 when
    # this note was written; 1.8.0 as of 2026-09-30).
    "ibm-watsonx-ai>=1.8.0",
    "logfire[fastapi,httpx]",
    # Use pydantic-ai-slim with the logfire extra only — NOT its own `openai`
    # extra, which raised its floor to openai>=3.0.0 in 2.32.0 (see ADR-2
    # below for why that extra is bypassed). `logfire` is the
    # instrument_pydantic_ai instrumentation (logging_setup.py); the
    # OpenAI-compatible chat client used by the Ollama provider comes from
    # the `openai` dependency declared directly below instead. Separately,
    # as of this floor, OpenAI-compatible providers (incl. Ollama) default
    # to an httpx2.AsyncClient rather than legacy httpx when no explicit
    # http_client is passed — src/pydantic_ai_sandbox/llm/providers/ollama.py
    # never passes one, so it gets httpx2; see
    # tests/unit/test_ollama_openai_compat.py's docstring for the discovery
    # and why that module mocks via httpx2.MockTransport, not respx.
    "pydantic-ai-slim[logfire]>=2.54.0",
    # ADR-2 (2026-08-22 dependency refresh; superseded 2026-10-04, spec 014
    # task 2.2, option (c); lower bound corrected 2026-10-04 after VDD review
    # caught the gap below): `openai` is declared directly here — bypassing
    # pydantic-ai-slim's own `openai` extra — instead of letting the
    # resolver pick one floor that satisfies both packages. litellm's
    # release currently locked in this project (1.103.2 — not the latest
    # upstream release, which moved to 1.104.0 on 2026-10-04; see
    # `uv.lock`) declares the range `openai<3.0.0,>=2.20.0`,
    # but several earlier patch releases pin an exact lower `openai` instead
    # of a range (1.83.2 -> `==2.30.0`, 1.83.14 -> `==2.24.0`; confirmed via
    # `pypi.org/pypi/litellm/<version>/json`), and pydantic-ai-slim's `openai`
    # extra floor rose to `openai>=3.0.0` in 2.32.0 and `openai>=3.8.0` by
    # 2.40.0. Letting the extra drive the resolve walks litellm BACK to
    # 1.83.0 — the one release whose `openai>=2.8.0` has no upper bound (an
    # upstream oversight, not a compatibility statement) and whose
    # `requires-python` (`<4.0,>=3.9`) does not exclude this project's 3.14
    # floor — which pip-audit (2026-10-04, scratch venv) reports as carrying
    # 14 known vulnerabilities (PYSEC-2026-388/391/2598/2599/2600/2601/2602/
    # 3476/3477/3479/3861/4066/4067/4070; the fix for all but 4066 lands by
    # 1.83.14, but 4066's earliest fix across litellm's parallel maintenance
    # branches is 1.88.6); that rollback is rejected.
    # The `openai` bound alone does not reject it, though: 1.83.0's
    # unbounded `openai>=2.8.0` is satisfiable anywhere inside the corrected
    # `>=2.47.0,<3.0.0` range below. The intermediate 1.84.0-1.92.x line
    # (which carries the 4066 fix progression but not the full one) declares
    # `requires-python<3.14`, so this project's *range-based* resolution
    # never lands on it (confirmed: a scratch copy of this project's full
    # tree with the `litellm` floor removed resolves bare "litellm" straight
    # to 1.103.2, 2026-10-04) — but these releases are real, un-yanked PyPI
    # entries, and `uv` will still resolve/install one if explicitly pinned
    # (`litellm==1.85.0`, say), ignoring the requires-python mismatch
    # (confirmed via `uv lock` and `uv pip install --dry-run`, 2026-10-04).
    # So "excluded on this project's floor" only holds for the default
    # range resolve, not for a hand-edited lockfile or an explicit pin —
    # which is exactly the lock-drift scenario an explicit `litellm` floor
    # is declared separately below (`litellm>=1.96.2`, the extra/dev-group
    # entries) to guard against.
    # The lower bound is `>=2.47.0`, not just `>=2.20.0`: pydantic-ai-slim's
    # OpenAI-compatible providers (incl. Ollama) default to an
    # httpx2.AsyncClient as `http_client=` (see the pydantic-ai-slim comment
    # above), and `openai` only gained the `_httpx2` module that accepts that
    # client type in 2.47.0 — confirmed empirically across sequential venv
    # installs: `openai==2.46.0` raises `TypeError: Invalid \`http_client\`
    # argument; Expected an instance of \`httpx.AsyncClient\` but got <class
    # 'httpx2.AsyncClient'>` at provider-construction time (before any
    # request is sent), while `openai==2.47.0` constructs cleanly. An
    # `openai` in `[2.20.0, 2.47.0)` therefore satisfied the old range but
    # would crash every Ollama call under this pydantic-ai-slim floor; the
    # corrected range below closes that gap at the dependency-resolution
    # level (a litellm release pinning an `openai` under 2.47.0 is now
    # infeasible against this root constraint, not merely unlikely).
    # Declaring `openai` directly instead keeps litellm on 1.103.2 (clean)
    # while letting pydantic-ai-slim run current (hub-verified floor
    # 2.54.0, confirmed against hub `main`@`afbe6eb` 2026-10-03 — raise this
    # floor together with `HUB_VERIFIED_PYDANTIC_AI_FLOOR` in
    # tests/unit/test_ollama_openai_compat.py, never separately).
    # This is explicitly an upstream-unsupported pairing — pydantic-ai-slim
    # itself only test-matrixes against the `openai` extra's own floor —
    # so tests/unit/test_ollama_openai_compat.py is the executable evidence
    # that the one path this project exercises (Ollama provider ->
    # OpenAIChatModel -> non-streaming Chat Completions) still round-trips
    # (response parsing, request body, ModelSettings.timeout forwarding,
    # httpx2 client construction) under this openai/pydantic-ai-slim
    # pairing; a live Ollama integration run is additional evidence, not a
    # substitute.
    # Remove this direct dependency — and let pydantic-ai-slim's own
    # `openai` extra take over again — as soon as litellm ships a release
    # declaring openai>=3.
    "openai>=2.47.0,<3.0.0",
    "pydantic-settings",
    "uvicorn",
]

# Optional LiteLLM transport for the watsonx provider (WATSONX_TRANSPORT=litellm,
# Req 2.6 / 11.5). Kept out of the default install to minimize supply-chain
# footprint; the builder import-guards on it and SDK-only deployments never
# need it. Install via `uv sync --extra litellm`. The openai version bound
# that keeps this extra on a safe litellm release is the root `openai`
# dependency above (ADR-2), not restated here.
# The `>=1.96.2` floor IS restated here (2026-10-04, 2nd-pass VDD review):
# the root `openai` range alone does not reject litellm 1.83.0 (ADR-2 above
# explains why), so this is an independent, structural safeguard against
# that rollback — not redundant with the openai bound. 1.96.2 is the latest
# fix point among litellm's 14 known-vulnerability IDs (PYSEC-2026-4066,
# the slowest-patched one) and is independently pip-audit-clean (confirmed
# 2026-10-04 against a scratch install, alongside the currently-locked
# 1.103.2). tests/unit/test_litellm_dependency_floor.py pins this.
[project.optional-dependencies]
litellm = ["litellm>=1.96.2"]

[dependency-groups]
dev = [
    # litellm is declared here in addition to the optional extra above: the test
    # suite must exercise the litellm path, and `uv sync` installs dev groups but
    # not extras. Without this the litellm tests fail collection. The `>=1.96.2`
    # floor is restated for the same reason it is restated on the extra above
    # (see that comment) — dependency-groups resolve together with
    # [project.dependencies] for the *openai* cap, but litellm's own floor is
    # not declared in [project.dependencies] at all, so there is nothing to
    # inherit here; omitting it would leave this group unguarded.
    "litellm>=1.96.2",
    "pip-audit",
    "pre-commit",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    # PyYAML is present transitively (via pre-commit) but imported directly by the
    # CI-workflow contract test, so it is declared here for honest resolution;
    # types-pyyaml satisfies pyright strict.
    "pyyaml",
    "types-pyyaml",
    # httpx2 is present transitively (via pydantic-ai-slim itself, and also
    # via its genai-prices dependency) but imported directly by
    # tests/unit/test_ollama_openai_compat.py (its MockTransport stands in
    # for the Ollama daemon's endpoint), so it is declared here for honest
    # resolution — same rationale as the PyYAML entry above.
    "httpx2",
    # HTTP-level mock for legacy-httpx request-path tests. Had exactly one
    # consumer, ever: task 2.1's original version of
    # tests/unit/test_ollama_openai_compat.py, before task 2.2 rewrote it
    # away from respx (confirmed via `grep -rl respx tests/ src/` against
    # the current tree returning nothing — not "the tree just before task
    # 2.2", which is a different, respx-using point in time; a 2026-10-04
    # VDD review caught this file's prior wording conflating the two). The
    # rewrite's reason: pydantic-ai-slim's
    # OpenAI-compatible providers (incl. Ollama) default to an
    # httpx2.AsyncClient when no explicit http_client is passed (confirmed
    # at the 2.54.0 floor; the exact version this default started at was not
    # independently verified), which respx cannot intercept — so that
    # module's request-path tests mock via httpx2's own MockTransport
    # instead (see that module's docstring). Kept here rather than removed:
    # out of task 2.2's boundary, and a future legacy-httpx-only consumer
    # (or a respx release with httpx2 support) could still use it.
    "respx",
    "ruff",
]

# Declaring a build backend flips this project from uv's "virtual" mode into a real
# package so `uv sync` performs the editable install (CI hit ModuleNotFoundError
# without it). packages= below is set explicitly for deterministic wheel builds.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_ai_sandbox"]

[tool.ruff]
target-version = "py314"
line-length = 100
# patterns/ lanes are independent uv projects with their own interpreters,
# dependency sets, and ruff/pyright configs (Spec 005 AD-1/AD-5). Excluding
# them here keeps `mise run check` scoped to the root app; lane gates run
# via `mise run patterns:check`. ruff >=0.16 also formats fenced ```python
# blocks in Markdown by default; docs/ and specs/ carry hand-authored
# snippets (comment alignment, prose-adjacent examples) that a blanket
# reformat would silently rewrite, so Markdown stays out of scope here too.
extend-exclude = ["patterns", "*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "BLE", # flake8-blind-except (broad excepts must carry a scoped noqa + rationale)
    "UP",  # pyupgrade
    "RUF", # ruff-specific
    "S",   # flake8-bandit (security: eval/exec, SQL injection, hardcoded secrets, pickle, subprocess)
    "A",   # flake8-builtins (prevent shadowing builtins)
    "SIM", # flake8-simplify
    "T20", # flake8-print (detect stray print statements)
    "D",   # pydocstyle (Google docstring format)
    "N",   # pep8-naming (CapWords classes, snake_case functions/variables)
    "C4",  # flake8-comprehensions (prefer list/dict/set comprehensions)
    "C90", # mccabe complexity
    "TCH", # flake8-type-checking (move type-only imports into TYPE_CHECKING blocks)
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "S101",   # use of assert (acceptable in tests)
    "D105",   # missing docstring in magic method
    "D107",   # missing docstring in __init__ (document in class docstring per Google style)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",  # assert is expected in tests
    "S105",  # hardcoded passwords acceptable in test fixtures
    "S106",
    "D",     # docstrings not required in tests
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["pydantic_ai_sandbox"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = ".venv"
venv = "."
# Same rationale as [tool.ruff].extend-exclude: lane code resolves against
# lane-local venvs (beeai-framework / llama-index are not installed here).
# Specifying `exclude` replaces pyright's defaults, so they are restated.
exclude = ["patterns", "**/node_modules", "**/__pycache__", "**/.*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Project root on sys.path so `from tests.support... ` resolves regardless of CWD
# or pytest's rootdir heuristics (some test files runtime-import from tests.support).
pythonpath = ["."]

[tool.coverage.run]
# Limit coverage measurement to first-party code; tests and stubs are excluded.
source = ["src/pydantic_ai_sandbox"]
branch = true
# Store relative paths in .coverage so the CI coverage-comment action (Docker,
# different workdir) can map files; absolute paths break py-cov-action.
relative_files = true

[tool.coverage.report]
# Coverage ratchet: raise this in lockstep with each provider-implementation task
# so newly added branches stay covered (plan.md §Performance Goals).
fail_under = 98
show_missing = true
skip_covered = false
