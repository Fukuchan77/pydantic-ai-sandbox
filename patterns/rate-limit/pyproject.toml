# patterns/rate-limit — slowapi-free rate limiting verification lane
# (docs/slowapi-replacement-plan.md §4).
#
# Independent uv project, depth 1 under patterns/ like sse/ and hitl/. It exists
# to prove candidate A of the plan — rate limiting built directly on `limits`,
# with no slowapi — against the versions the hub's `services/api` cannot take
# today, before that change is carried into the hub:
#
# * Python is pinned to 3.15 (`.python-version`). Every other lane stays on
#   3.13/3.14; this lane is the only one on 3.15 and nothing imports it.
# * fastapi / starlette carry floors only, no upper bound. Removing the hub's
#   `fastapi<0.137` / `starlette<1.0` caps is the point of the exercise, so
#   capping them here would verify nothing. The lockfile records exactly which
#   versions were verified.
# * pytest runs with `error::DeprecationWarning` and no ignore entries (plan §4
#   step 3) — the hub's Python 3.13 hold exists because slowapi and starlette
#   0.52 call the 3.14-deprecated `asyncio.iscoroutinefunction`.
#
# The lane is framework-agnostic in the sibling-lane sense: it imports no
# sibling lane and no agent framework. `patterns-contracts` is dev-only, for the
# shared anti-false-green guard on the live Redis suite.

[project]
name = "patterns-rate-limit"
version = "0.1.0"
description = "Cross-framework agent patterns — rate limiting on limits directly (slowapi replacement verification lane)."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    # 0.137 is the release that wraps included routers in `_IncludedRouter`
    # and silently disabled slowapi's global limit. The floor sits above it so
    # this lane can only ever verify against the post-change router.
    "fastapi>=0.142.2",
    # 1.x is the line slowapi 0.1.10 is incompatible with.
    "starlette>=1.7.0",
    # The counting engine slowapi wraps. `redis` is the extra this lane uses
    # through `limits.aio`'s `redispy` implementation (redis.asyncio).
    "limits[redis]>=5.8.0",
]

[dependency-groups]
dev = [
    # Shared anti-false-green guard (EXPECT_LIVE_TESTS) for tests/integration.
    "patterns-contracts",
    "httpx>=0.28.1",
    "pip-audit",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patterns_rate_limit"]

[tool.uv.sources]
patterns-contracts = { path = "../contracts", editable = true }

[tool.ruff]
target-version = "py315"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "BLE", "UP", "RUF", "S", "A", "SIM", "T20", "D", "N", "C4", "C90", "TCH"]
ignore = ["E501", "S101", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["patterns_rate_limit"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.15"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# Plan §4 step 3: deprecation warnings are hard errors with NO ignore entries.
# Do not add an `ignore::` line here to get green — a warning on Python 3.15 is
# the finding this lane exists to surface.
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["src/patterns_rate_limit"]
branch = true
relative_files = true

[tool.coverage.report]
fail_under = 98
show_missing = true
skip_covered = false
